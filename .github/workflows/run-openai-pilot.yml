name: Run OpenAI pilot

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of prompts to run. Leave blank for all prompts.
        required: false
        default: "3"
      model:
        description: OpenAI model to use.
        required: false
        default: "gpt-5.5"

permissions:
  contents: write

jobs:
  run-pilot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare run config
        run: |
          cp configs/experiment.example.yaml configs/experiment.github.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("configs/experiment.github.yaml")
          config = yaml.safe_load(path.read_text())
          model = "${{ github.event.inputs.model }}".strip()
          if model:
              config["model"] = model
          model_slug = config["model"].replace("/", "-").replace(":", "-")
          config["output_file"] = f"data/raw/openai_outputs_{model_slug}.jsonl"
          if config["model"].startswith("gpt-5.5"):
              config["temperature"] = None
              config["top_p"] = None
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY

      - name: Run experiment
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then
            python scripts/run_openai_experiment.py --config configs/experiment.github.yaml
          else
            python scripts/run_openai_experiment.py --config configs/experiment.github.yaml --limit "$LIMIT"
          fi

      - name: Analyze results if present
        if: always()
        run: |
          MODEL="${{ github.event.inputs.model }}"
          if [ -z "$MODEL" ]; then MODEL="gpt-5.5"; fi
          MODEL_SLUG=$(echo "$MODEL" | sed 's#[/:]#-#g')
          OUTPUT_FILE="data/raw/openai_outputs_${MODEL_SLUG}.jsonl"
          if [ -s "$OUTPUT_FILE" ]; then
            python scripts/analyze_results.py \
              --input "$OUTPUT_FILE" \
              --output "results/metrics_summary_${MODEL_SLUG}.csv" \
              --summary-output "results/condition_summary_${MODEL_SLUG}.csv"
          else
            echo "No output file found for ${MODEL}; skipping analysis."
          fi

      - name: Commit available results
        if: always()
        run: |
          MODEL="${{ github.event.inputs.model }}"
          if [ -z "$MODEL" ]; then MODEL="gpt-5.5"; fi
          MODEL_SLUG=$(echo "$MODEL" | sed 's#[/:]#-#g')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/raw/openai_outputs_${MODEL_SLUG}.jsonl" "results/metrics_summary_${MODEL_SLUG}.csv" "results/condition_summary_${MODEL_SLUG}.csv" || true
          git commit -m "Add OpenAI pilot results for ${MODEL}" || echo "No changes to commit"
          git push
