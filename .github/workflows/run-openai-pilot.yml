name: Run OpenAI pilot

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of prompts to run. Leave blank for all prompts.
        required: false
        default: "3"
      model:
        description: OpenAI model to use.
        required: false
        default: "gpt-5.4-nano"

permissions:
  contents: write

jobs:
  run-pilot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare run config
        run: |
          cp configs/experiment.example.yaml configs/experiment.github.yaml
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path("configs/experiment.github.yaml")
          config = yaml.safe_load(path.read_text())
          model = "${{ github.event.inputs.model }}".strip()
          if model:
              config["model"] = model
          config["output_file"] = "data/raw/openai_outputs.jsonl"
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY

      - name: Run experiment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then
            python scripts/run_openai_experiment.py --config configs/experiment.github.yaml
          else
            python scripts/run_openai_experiment.py --config configs/experiment.github.yaml --limit "$LIMIT"
          fi

      - name: Analyze results
        run: |
          python scripts/analyze_results.py --input data/raw/openai_outputs.jsonl --output results/metrics_summary.csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/openai_outputs.jsonl results/metrics_summary.csv
          git commit -m "Add OpenAI pilot results" || echo "No changes to commit"
          git push
